name: Foundations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli-session-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker pull $(node -p "require('./spike/sandbox/image.lock.json').image")
      - run: npm run install:cli-fixtures
      - run: npm run spike:cli-session
      - run: npm run spike:managed-adversarial
      - run: npm run spike:session-continuity
      - run: npm run spike:owner-crash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-cli-fixture-evidence
          path: |
            .local/cli-session/*/report.json
            .local/managed-adversarial/*/report.json
            .local/managed-continuity/*/report.json
            .local/managed-owner-crash/*/report.json
          if-no-files-found: warn
  sandbox-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run spike:sandbox
      - run: npm run spike:coding-verifier
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-fixture-evidence
          path: |
            .local/sandbox/*/report.json
            .local/coding-verifier/*/report.json
          if-no-files-found: warn
  postgres-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: commongrid_test
          POSTGRES_PASSWORD: ci_only_ephemeral_database
          POSTGRES_DB: commongrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commongrid_test -d commongrid_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/coordinator/go.mod
          cache: false
      - run: npm run test:db
        env:
          CG_TEST_DATABASE_URL: postgresql://commongrid_test:ci_only_ephemeral_database@127.0.0.1:5432/commongrid_test?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-domain-evidence
          path: .local/postgres-tests/*/report.json
          if-no-files-found: warn
  contracts-api-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/coordinator/go.mod
          cache-dependency-path: services/coordinator/go.sum
      - run: npm ci
      - run: npm run check
      - run: node scripts/ui-tests.mjs install --with-deps chromium --only-shell
      - run: npm run test:ui
  artifact-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/coordinator/go.mod
          cache: false
      - run: npm run install:trivy
      - run: npm run test:artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-delivery-evidence
          path: .local/artifact-tests/*/report.json
          if-no-files-found: warn
  desktop-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: node --import tsx --test packages/agent-adapters/test/owned-process.test.ts
      - run: node scripts/native.mjs build --no-bundle
  temporal-fixtures:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: spike/temporal/go.mod
          cache: false
      - run: npm run test:spike
      - run: npm run install:temporal
      - run: npm run spike:recovery
