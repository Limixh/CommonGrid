services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: commongrid
      POSTGRES_DB: commongrid
      POSTGRES_PASSWORD: ${CG_DEV_POSTGRES_PASSWORD:?Set CG_DEV_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - commongrid-postgres:/var/lib/postgresql/data
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commongrid -d commongrid"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  commongrid-postgres:
