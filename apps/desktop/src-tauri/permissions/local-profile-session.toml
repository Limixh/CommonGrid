[[permission]]
identifier = "local-profile-session"
description = "Start, observe and cancel managed CLI sessions for the saved selected local profile, and open only the fixed official Codex device page on demand. No caller paths, credentials, shell or URL arguments."
commands.allow = ["local_profile_session_start", "local_profile_session_status", "local_profile_session_cancel", "local_profile_session_open_device"]
